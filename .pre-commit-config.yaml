repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.21  # Use the latest Ruff version
    hooks:
      # Run the linter
      - id: ruff-check
        args: [ --fix ] # Optional: auto-fix safe lint errors
      # Run the formatter
      - id: ruff-format
  - repo: https://github.com/astral-sh/uv-pre-commit
    rev: 0.11.29 # or the latest release tag
    hooks:
      - id: uv-lock
  - repo: https://github.com/astral-sh/ty-pre-commit
    # ty version.
    rev: v0.0.59
    hooks:
      - id: ty