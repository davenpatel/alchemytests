repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
    - id: check-merge-conflict
    - id: check-toml
    - id: check-yaml
    - id: end-of-file-fixer
    - id: trailing-whitespace
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.0  # Use the latest Ruff version
    hooks:
      # Run the linter
      - id: ruff-check
        args: [ --fix ] # Optional: auto-fix safe lint errors
      # Run the formatter
      - id: ruff-format
  - repo: https://github.com/astral-sh/uv-pre-commit
    rev: 0.11.32 # or the latest release tag
    hooks:
      - id: uv-lock
  - repo: https://github.com/astral-sh/ty-pre-commit
    # ty version.
    rev: v0.0.63
    hooks:
      - id: ty
